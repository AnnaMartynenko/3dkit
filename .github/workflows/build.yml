name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/values.yaml'   # щоб коміт тегу не запускав збірку наново

permissions:
  contents: write    # пише тег у СВІЙ репозиторій
  packages: write    # кладе образ у ghcr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/annamartynenko/3dkit:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: bump tag
        run: |
          sed -i "s|^  tag: .*|  tag: sha-${{ github.sha }}|" deploy/values.yaml
          git config user.name  "ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "deploy: sha-${{ github.sha }}"
          git push
