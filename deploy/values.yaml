# Опис розгортання 3dkit. Chart лежить у nickROMAnt/Mono,
# сюди CI вписує лише новий тег образу.
image:
  repository: ghcr.io/annamartynenko/3dkit
  tag: sha-2678483ea2a5108f8e9fc55a20588fd9b5e5b7e3

service:
  port: 80
  targetPort: 80

probes:
  readiness: /
  liveness: /

replicas:
  min: 2

autoscaling:
  enabled: false

ingress:
  enabled: true
  host: 3dkit.com.ua
  path: /

resources:
  requests: { cpu: 5m, memory: 8Mi }
  limits:   { cpu: 50m, memory: 48Mi }
