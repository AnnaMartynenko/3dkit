# Опис розгортання 3dkit. Chart лежить у nickROMAnt/Mono,
# сюди CI вписує лише новий тег образу.
image:
  repository: ghcr.io/annamartynenko/3dkit
  tag: sha-acff03d03b71caef684ff2b1ebb61924d94fc7ac

service:
  port: 80
  targetPort: 80

probes:
  readiness: /
  liveness: /

replicas:
  min: 2

autoscaling:
  enabled: false

ingress:
  enabled: true
  host: 3dkit.com.ua
  extraHosts:
    - www.3dkit.com.ua
  path: /
  tls:
    # Secret із сертифікатом живе в кластері, у namespace web.
    # Зараз туди покладений наявний сертифікат certbot;
    # далі його обслуговуватиме cert-manager через HTTP-01.
    secretName: 3dkit-tls

resources:
  requests: { cpu: 5m, memory: 8Mi }
  limits:   { cpu: 50m, memory: 48Mi }
