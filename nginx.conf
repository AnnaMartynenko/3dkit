server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: прямі посилання на внутрішні маршрути інакше дали б 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Імена файлів містять хеш вмісту, тож кешувати можна назавжди
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
